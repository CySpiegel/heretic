[project]
name = "heretic-llm"
version = "2.0.0.dev0"
description = "Fully automatic censorship removal for language models"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Philipp Emanuel Weidmann", email = "pew@worldwidemann.com" }
]
requires-python = ">=3.10"
keywords = ["llm", "transformer", "abliteration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "accelerate~=1.13",
    "bitsandbytes~=0.50",
    "datasets~=4.7",
    "huggingface-hub~=1.7",
    "immutabledict~=4.3",
    "langdetect~=1.0",
    "lm-eval[hf]~=0.4",
    "numpy~=2.2",
    "optuna~=4.7",
    "peft~=0.19",
    "psutil~=7.2",
    "py-cpuinfo~=9.0",
    "pydantic-settings~=2.13",
    "questionary~=2.1",
    "rich~=14.3",
    "tomli-w~=1.2",
    "torch",  # version deliberately unspecified
    "torchvision",  # version deliberately unspecified
    "tqdm~=4.67",
    "transformers[kernels]~=5.6",
]

[project.optional-dependencies]
research = [
    "geom-median~=0.1",
    "imageio~=2.37",
    "matplotlib~=3.10",
    "pacmap~=0.8",
    "scikit-learn~=1.7",
]
# Accelerator backends. "cuda" is the PyPI default (NVIDIA CUDA, also used for CPU-only
# installs); "xpu" installs PyTorch from the official PyTorch XPU wheel index for Intel GPUs.
# Enable XPU with `uv sync --extra xpu` or `uv run --extra xpu heretic`.
# It requires the Intel GPU compute runtime (Level Zero) to be installed on the system.
cuda = [
    "torch",  # version deliberately unspecified
    "torchvision",  # version deliberately unspecified
]
xpu = [
    "torch",  # version deliberately unspecified
    "torchvision",  # version deliberately unspecified
    "triton-xpu",  # required by the XPU torch wheel; not published on PyPI
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "ty>=0.0.5",
]

[project.urls]
Homepage = "https://heretic-project.org"
Documentation = "https://heretic-project.org/tutorial"
Repository = "https://github.com/p-e-w/heretic.git"
Issues = "https://github.com/p-e-w/heretic/issues"
Changelog = "https://github.com/p-e-w/heretic/releases"

[project.scripts]
heretic = "heretic.main:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
# The accelerator extras are mutually exclusive because they install different torch builds.
conflicts = [[{ extra = "cuda" }, { extra = "xpu" }]]

# The PyTorch XPU wheel index is only consulted for packages that explicitly
# opt into it below (via the "xpu" extra); all other packages come from PyPI.
[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-xpu", extra = "xpu" }]
torchvision = [{ index = "pytorch-xpu", extra = "xpu" }]
# Transitive dependency of the XPU torch wheel that is not published on PyPI.
triton-xpu = [{ index = "pytorch-xpu", extra = "xpu" }]

[tool.uv.build-backend]
module-name = "heretic"
