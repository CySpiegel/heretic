# Cybersecurity abliteration run.
# Good prompts (what "normal" looks like) stay the generic harmless set so that
# only security-refusals are ablated. Bad prompts and the KeywordRate refusal
# scorer both point at the local cybersecurity prompt file; the two slices do
# not overlap so the score is measured on held-out prompts.

model = "Qwen/Qwen3.8-27B"

# Raise the abliteration ceiling: this model pinned against the old 1.5 bound.
max_weight_upper_bound = 2.5

n_trials = 200
n_startup_trials = 60

scorers = [
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize" },
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
]

[good_prompts]
dataset = "mlabonne/harmless_alpaca"
split = "train[:400]"
column = "text"

[bad_prompts]
dataset = "../../prompts/cybersecurity.txt"
split = "[:320]"

[scorer.KeywordRate.prompts]
dataset = "../../prompts/cybersecurity.txt"
split = "[320:]"

[scorer.KLDivergence.prompts]
dataset = "mlabonne/harmless_alpaca"
split = "test[:100]"
column = "text"
